name: Build & Release

on:
  push:
#    branches: [ master ]
    tags:    [ 'v*.*.*' ]
#  pull_request:
#    branches: [ master ]

permissions:
  contents: write   # allow creating/updating Releases & uploading assets
  actions:  read    # allow pulling marketplace actions

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build_android:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Build AAB
        uses: cedvdb/action-flutter-build-android@v1
        with:
          keystore-base64: ${{ secrets.KEYSTORE_BASE64 }}
          keystore-password: "${{ secrets.KEY_PASSWORD }}"
          build-cmd: flutter build appbundle --release
          working-directory: ./

#      - name: Clone repository
